  </defs>
  <rect width="512" height="512" fill="url(#mainGrad)" rx="100" />
  <g transform="translate(256, 256)">
    <circle cx="0" cy="0" r="140" fill="none" stroke="white" stroke-width="20" stroke-linecap="round" stroke-dasharray="200 240" transform="rotate(-90)"/>
    <path d="M-60 0 L0 -70 L60 0" fill="none" stroke="white" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
