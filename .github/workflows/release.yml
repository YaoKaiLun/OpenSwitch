name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build App
        run: |
          chmod +x Scripts/*.sh
          ./Scripts/package.sh

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenSwitch
          path: OpenSwitch-*.dmg

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: OpenSwitch-*.dmg
