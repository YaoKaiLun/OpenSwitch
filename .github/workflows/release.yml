name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install Pillow

      - name: Generate Icons
        run: python3 Scripts/create-icons-simple.py

      - name: Build App
        run: |
          chmod +x Scripts/*.sh
          ./Scripts/package.sh

      - name: Upload Artifact
        uses: actions/upload-artifact@v5
        with:
          name: OpenSwitch
          path: OpenSwitch-*.dmg

      - name: Create Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: OpenSwitch-*.dmg
